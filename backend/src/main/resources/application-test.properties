# PostgreSQL Test Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/financial_test
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres_test
spring.datasource.password=senha_teste

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization (Geralmente desativado ou script diferente para testes)
spring.sql.init.mode=never
