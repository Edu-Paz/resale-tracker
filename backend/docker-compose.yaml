version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: financial-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-financial_test}
      - POSTGRES_USER=${DB_USERNAME:-postgres_test}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-senha_teste}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
